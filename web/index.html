<!DOCTYPE html>
<html>
<script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.4.8/angular.min.js"></script>

<body>
	<div ng-app="loginModule" ng-controller="loginController">
		<h2>Please enter your login</h2>
		User Name: <input type="text" ng-model="account.name">
		Password: <input type="password" ng-model="account.pwd">
		<button ng-click="checklogin(account.name, account.pwd)">submit</button>
		<a href="myPage.html">myPage</a>
	</div>

	<script>
		angular.module("loginModule", [])
			.controller("loginController", function ($scope, $http) {
				$scope.account = {
					name: 'user name',
					pwd: 'xxxxxx'
				};
				$scope.checklogin = function (userName, password) {
					$http({
						url: "http://localhost:3001/checkUser",
						method: "GET",
						params: $scope.account
					}).then(function (response) {
						alert(response.data);
					});
				}
			});
	</script>
</body>

</html>
